<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無音区間オートカット Pro (JP)</title>

  <!-- ffmpeg.wasm (CDN) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Service Worker (COOP/COEP) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./coi-serviceworker.js').catch(e=>{});
      });
    }
  </script>

  <style>
    :root {
      /* 色設定: ロゴベース + ダークテーマ */
      --bg-body: #0b0d11;
      --bg-panel: #14181f;
      --bg-input: #080a0d;
      
      --primary: #8DC21F;
      --primary-hover: #a3db2e;
      --accent: #4aa3ff;
      
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      
      --border: 1px solid rgba(255, 255, 255, 0.08);
      --radius: 12px;
      
      --font-base: "Noto Sans JP", "Inter", sans-serif;
      --font-mono: "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-base);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* アプリっぽく画面固定 */
    }

    /* --- Header --- */
    header {
      height: 60px;
      background: rgba(20, 24, 31, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-inner {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      width: 140px;
      max-width: 20vw;
      min-width: 100px;
      transition: opacity 0.2s;
    }
    .logo:hover { opacity: 0.9; }
    .logo svg { width: 100%; height: auto; display: block; }

    .app-status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #333;
      border-radius: 50%;
    }
    .status-dot.active { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

    /* --- Main Layout (Dashboard) --- */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr; /* 左パネル固定幅、右可変 */
      gap: 0;
      overflow: hidden;
      max-width: 1920px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; overflow-y: auto; }
      body { overflow: auto; height: auto; }
    }

    /* --- Panels --- */
    .panel-left {
      background: var(--bg-panel);
      border-right: var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .panel-right {
      padding: 24px;
      background: var(--bg-body);
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::before {
      content: ''; width: 4px; height: 14px;
      background: var(--primary); border-radius: 2px;
    }

    /* --- Components --- */
    
    /* File Input */
    .drop-zone {
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.02);
    }
    .drop-zone:hover {
      border-color: var(--primary);
      background: rgba(141, 194, 31, 0.05);
    }
    .drop-zone-text {
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      margin-top: 8px;
    }
    .drop-zone-sub {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 4px;
    }
    .icon-folder { font-size: 24px; }

    /* Sliders (Mixer Style) */
    .control-group {
      background: rgba(0,0,0,0.2);
      padding: 16px;
      border-radius: var(--radius);
      border: var(--border);
    }
    
    .slider-item { margin-bottom: 20px; }
    .slider-item:last-child { margin-bottom: 0; }
    
    .slider-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .label-main { color: var(--text-main); font-weight: 500; }
    .label-val { color: var(--accent); font-family: var(--font-mono); }
    
    .slider-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px; width: 16px;
      border-radius: 50%;
      background: var(--text-main);
      margin-top: -6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border: 2px solid var(--bg-panel);
      transition: transform 0.1s;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.2);
      background: var(--primary);
    }

    /* Waveform Canvas */
    .waveform-wrap {
      position: relative;
      background: #000;
      border-radius: var(--radius);
      border: var(--border);
      height: 120px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* Video Player */
    .preview-container {
      width: 100%;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      /* プレビューの高さ制限（自動調整） */
      max-height: 50vh; 
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* アスペクト比を維持 */
      max-height: 50vh;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: var(--primary);
      color: #000;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-primary:disabled { background: #333; color: #555; cursor: not-allowed; }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text-main);
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Segment List */
    .segment-list-wrap {
      flex: 1;
      background: var(--bg-panel);
      border-radius: var(--radius);
      border: var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0; /* Flexbox内でスクロールさせるために必要 */
    }
    .list-header {
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: var(--border);
      display: flex;
      justify-content: space-between;
    }
    .list-body {
      flex: 1;
      overflow-y: auto;
    }
    .segment-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
    }
    .segment-row:hover { background: rgba(255,255,255,0.05); }
    .row-id { color: var(--text-muted); width: 30px; }
    .row-time { color: var(--text-main); }
    .row-dur { color: var(--primary); font-weight: 500; }

    /* Export Section */
    .export-section {
      background: var(--bg-panel);
      border: var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }
    
    .log-console {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #666;
      height: 60px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
      margin-top: 8px;
    }

    #downloadBtn {
      display: none;
      text-decoration: none;
      text-align: center;
      display: block;
      background: rgba(74, 163, 255, 0.1);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      transition: background 0.2s;
      display: none; /* JSで制御 */
    }
    #downloadBtn:hover { background: rgba(74, 163, 255, 0.2); }

  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">

    </div>
  </header>

  <main>
    <!-- Left Panel: Controls -->
    <div class="panel-left">
      <!-- File Input -->
      <label class="drop-zone">
        <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none;">
        <div class="icon-folder">📂</div>
        <div class="drop-zone-text">動画ファイルを選択</div>
        <div class="drop-zone-sub" id="fileNameDisplay">またはここにドラッグ＆ドロップ</div>
      </label>

      <!-- Waveform (Visualizer) -->
      <div>
        <h2><span style="font-size:18px">📊</span> 解析波形</h2>
        <div class="waveform-wrap">
          <canvas id="waveformCanvas" title="クリックで再生位置を移動"></canvas>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:10px; color:#666; margin-top:4px;">
          <span>無音 (-60dB)</span>
          <span>最大音量 (0dB)</span>
        </div>
      </div>

      <!-- Parameters -->
      <div class="control-group">
        <h2>🎚 パラメータ調整</h2>
        
        <div class="slider-item">
          <div class="slider-header">
            <span class="label-main">しきい値 (Threshold)</span>
            <span class="label-val" id="thresholdVal">-30 dB</span>
          </div>
          <div class="slider-desc">この値より小さい音を「無音」とみなします。</div>
          <input type="range" id="threshold" min="-60" max="-10" value="-30" step="1">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="label-main">最短発話時間</span>
            <span class="label-val" id="minDurationVal">0.3 s</span>
          </div>
          <div class="slider-desc">これより短い音はノイズとみなしカットします。</div>
          <input type="range" id="minDuration" min="0.1" max="2.0" value="0.3" step="0.1">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span class="label-main">前後の余白</span>
            <span class="label-val" id="paddingVal">0.1 s</span>
          </div>
          <div class="slider-desc">カット区間の前後に余韻を残します。</div>
          <input type="range" id="padding" min="0.0" max="1.0" value="0.1" step="0.05">
        </div>

        <button id="analyzeBtn" class="btn btn-primary" style="width:100%; margin-top:12px;" disabled>
          🔍 音量を解析する
        </button>
      </div>
    </div>

    <!-- Right Panel: Preview & Output -->
    <div class="panel-right">
      
      <!-- Video Monitor -->
      <div class="preview-container">
        <video id="previewPlayer" playsinline controls></video>
      </div>
      
      <div class="action-bar">
        <button id="previewCutBtn" class="btn btn-secondary" disabled>▶ カット後をプレビュー</button>
        <button id="stopPreviewBtn" class="btn btn-secondary" style="display:none; color:#ff6b6b;">■ 停止</button>
      </div>

      <!-- Segment List -->
      <div class="segment-list-wrap">
        <div class="list-header">
          <span>検出された発話区間</span>
          <span id="segmentCount">0 箇所</span>
        </div>
        <div class="list-body" id="segmentsList">
          <div style="padding:20px; text-align:center; color:#444; font-size:12px;">
            まだ解析されていません
          </div>
        </div>
      </div>

      <!-- Export -->
      <div class="export-section">
        <button id="exportBtn" class="btn btn-primary" style="width:100%;" disabled>
          🎬 動画を書き出し (エンコード)
        </button>
        
        <div class="progress-bar">
          <div id="exportProgress" class="progress-fill"></div>
        </div>
        
        <div class="status-msg" id="exportStatus" style="font-size:12px; color:#aaa;"></div>
        <a id="downloadBtn" href="#" download>⬇ 動画をダウンロード</a>
        
        <div class="log-console" id="logConsole">System Ready.</div>
      </div>

    </div>
  </main>

  <script>
  // --- UI Elements ---
  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const previewPlayer = document.getElementById('previewPlayer');
  
  // Canvas
  const waveformCanvas = document.getElementById('waveformCanvas');

  // Buttons
  const analyzeBtn = document.getElementById('analyzeBtn');
  const exportBtn = document.getElementById('exportBtn');
  const previewCutBtn = document.getElementById('previewCutBtn');
  const stopPreviewBtn = document.getElementById('stopPreviewBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // Lists & Status
  const segmentsList = document.getElementById('segmentsList');
  const exportProgress = document.getElementById('exportProgress');
  const exportStatus = document.getElementById('exportStatus');
  const logConsole = document.getElementById('logConsole');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  // Sliders
  const sThreshold = document.getElementById('threshold');
  const sMinDur = document.getElementById('minDuration');
  const sPadding = document.getElementById('padding');

  // --- State ---
  let ffmpeg = null;
  let audioBuffer = null;
  let rawFile = null;
  let detectedSegments = [];
  let isPreviewingCuts = false;
  let previewTimeout = null;

  // --- Utils ---
  const log = (msg) => {
    const t = new Date().toLocaleTimeString();
    logConsole.innerText = `[${t}] ${msg}\n` + logConsole.innerText;
  };

  const setStatus = (msg, active = false) => {
    statusText.innerText = msg;
    if(active) statusDot.classList.add('active');
    else statusDot.classList.remove('active');
  };

  const updateSliderUI = (id, val, unit) => {
    document.getElementById(id + 'Val').innerText = val + unit;
  };

  // --- Initialization ---
  if (!window.crossOriginIsolated) {
    log("⚠️ 注意: SharedArrayBufferが無効です。処理速度が低下する可能性があります。");
  }

  // --- Event Listeners for Sliders ---
  [sThreshold, sMinDur, sPadding].forEach(el => {
    // 1. Input: 数値表示と「しきい値ライン」の再描画のみ（高速）
    el.addEventListener('input', () => {
      updateSliderUI(el.id, el.value, el.id === 'threshold' ? ' dB' : ' s');
      if (audioBuffer) {
        // 波形だけ再描画（しきい値ラインを動かすため）
        const rawData = audioBuffer.getChannelData(0);
        drawWaveformWithThreshold(rawData, audioBuffer.sampleRate);
      }
    });

    // 2. Change: マウスを離したときに計算実行
    el.addEventListener('change', () => {
      if (audioBuffer) {
        detectSilence();
      }
    });
  });

  // --- FFmpeg Load ---
  const initFFmpeg = async () => {
    if (ffmpeg) return;
    const { createFFmpeg, fetchFile } = FFmpeg;
    log("システム起動中: FFmpegをロードしています...");
    
    ffmpeg = createFFmpeg({
      log: false, // コンソールログ抑制
      corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
      progress: ({ ratio }) => {
        if (ratio >= 0 && ratio <= 1) {
          exportProgress.style.width = `${ratio * 100}%`;
          exportStatus.innerText = `処理中... ${(ratio * 100).toFixed(0)}%`;
        }
      }
    });
    await ffmpeg.load();
    log("システム準備完了: FFmpeg Ready");
  };

  // --- File Input ---
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    rawFile = file;
    fileNameDisplay.innerText = file.name;
    previewPlayer.src = URL.createObjectURL(file);
    
    // Reset
    audioBuffer = null;
    detectedSegments = [];
    exportBtn.disabled = true;
    previewCutBtn.disabled = true;
    downloadBtn.style.display = 'none';
    analyzeBtn.disabled = false;
    
    setStatus("ファイル選択済み", true);
    log(`ファイル読み込み: ${file.name}`);

    // キャンバスリセット
    const ctx = waveformCanvas.getContext('2d');
    ctx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
    segmentsList.innerHTML = '<div style="padding:20px; text-align:center; color:#444;">解析ボタンを押してください</div>';
  });

  // --- Analyze ---
  analyzeBtn.addEventListener('click', async () => {
    if (!rawFile) return;
    analyzeBtn.disabled = true;
    setStatus("音声解析中...", true);
    
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      try {
        log("ネイティブデコーダーで解析中...");
        const ab = await rawFile.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(ab.slice(0));
      } catch (e) {
        log("ネイティブデコード失敗。FFmpegフォールバックを使用します...");
        audioBuffer = await decodeWithFFmpeg(rawFile, audioCtx);
      }

      log(`解析完了: ${audioBuffer.duration.toFixed(2)}秒`);
      detectSilence();
      setStatus("解析完了", false);

    } catch (e) {
      console.error(e);
      log("エラー: " + e.message);
      setStatus("解析エラー", false);
    } finally {
      analyzeBtn.disabled = false;
    }
  });

  async function decodeWithFFmpeg(file, audioCtx) {
    if (!ffmpeg) await initFFmpeg();
    const { fetchFile } = FFmpeg;
    const name = 'temp.mov';
    ffmpeg.FS('writeFile', name, await fetchFile(file));
    await ffmpeg.run('-i', name, '-vn', '-acodec', 'pcm_s16le', '-ar', '44100', '-ac', '1', 'out.wav');
    const data = ffmpeg.FS('readFile', 'out.wav');
    ffmpeg.FS('unlink', name); ffmpeg.FS('unlink', 'out.wav');
    return await audioCtx.decodeAudioData(data.buffer);
  }

  // --- Detection Logic ---
  function detectSilence() {
    if (!audioBuffer) return;
    
    const rawData = audioBuffer.getChannelData(0);
    const sr = audioBuffer.sampleRate;
    
    const thDB = parseFloat(sThreshold.value);
    const minDur = parseFloat(sMinDur.value);
    const pad = parseFloat(sPadding.value);
    
    const winSize = Math.floor(sr * 0.05); // 50ms
    const segments = [];
    
    let isSpeaking = false;
    let startFrame = 0;
    
    // 1. RMS Detect
    for (let i = 0; i < rawData.length; i += winSize) {
      let sum = 0;
      const end = Math.min(i + winSize, rawData.length);
      for (let j = i; j < end; j++) { sum += rawData[j] * rawData[j]; }
      const rms = Math.sqrt(sum / (end - i));
      const db = 20 * Math.log10(rms);
      
      const isLoud = db > thDB;
      if (isLoud && !isSpeaking) {
        isSpeaking = true; startFrame = i;
      } else if (!isLoud && isSpeaking) {
        isSpeaking = false;
        segments.push({ start: startFrame/sr, end: i/sr });
      }
    }
    if (isSpeaking) segments.push({ start: startFrame/sr, end: rawData.length/sr });

    // 2. Merge & Pad
    let merged = [];
    if (segments.length > 0) {
      let cur = { start: Math.max(0, segments[0].start - pad), end: segments[0].end + pad };
      for (let k = 1; k < segments.length; k++) {
        const nS = Math.max(0, segments[k].start - pad);
        const nE = segments[k].end + pad;
        if (nS <= cur.end) {
          cur.end = Math.max(cur.end, nE);
        } else {
          if (cur.end - cur.start >= minDur) merged.push(cur);
          cur = { start: nS, end: nE };
        }
      }
      if (cur.end - cur.start >= minDur) merged.push(cur);
    }
    
    detectedSegments = merged.map(s => ({
      start: Math.max(0, s.start),
      end: Math.min(audioBuffer.duration, s.end)
    }));

    log(`区間検出: ${detectedSegments.length}箇所`);
    
    // 描画とリスト更新
    drawWaveformWithThreshold(rawData, sr);
    renderList();

    const hasSeg = detectedSegments.length > 0;
    exportBtn.disabled = !hasSeg;
    previewCutBtn.disabled = !hasSeg;
  }

  // --- Waveform with Auto-Scaling & Threshold Line ---
  function drawWaveformWithThreshold(data, sr) {
    const ctx = waveformCanvas.getContext('2d');
    const w = waveformCanvas.width = waveformCanvas.offsetWidth;
    const h = waveformCanvas.height = waveformCanvas.offsetHeight;
    
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // 1. Auto-Scaling (最大音量を探して正規化する)
    // 処理を軽くするため、100サンプル飛ばし程度で最大値を探す
    let maxAmp = 0;
    for (let i=0; i < data.length; i += 100) {
      const val = Math.abs(data[i]);
      if (val > maxAmp) maxAmp = val;
    }
    if (maxAmp < 0.01) maxAmp = 0.01; // ゼロ除算防止
    const scaleFactor = (h / 2) * 0.9 / maxAmp; // 高さの90%まで使う

    // 2. Draw Wave
    ctx.beginPath();
    ctx.strokeStyle = '#8DC21F'; // Primary Green
    ctx.lineWidth = 1;
    
    const step = Math.ceil(data.length / w);
    const centerY = h / 2;

    for(let x=0; x < w; x++) {
      const idx = x * step;
      const val = data[idx] || 0;
      const y = val * scaleFactor; 
      ctx.moveTo(x, centerY - y);
      ctx.lineTo(x, centerY + y);
    }
    ctx.stroke();

    // 3. Draw Segments Highlight
    ctx.fillStyle = 'rgba(141, 194, 31, 0.15)';
    const totalSec = data.length / sr;
    
    detectedSegments.forEach(seg => {
      const x = (seg.start / totalSec) * w;
      const wid = ((seg.end - seg.start) / totalSec) * w;
      ctx.fillRect(x, 0, wid, h);
    });

    // 4. Draw Threshold Line (Blue Line)
    // dB -> Amplitude conversion: amp = 10 ^ (dB / 20)
    // しかし、このキャンバスはauto-scaleされているため、
    // しきい値も「その波形の中で相対的にどのくらいか」を表示するのは難しい（RMSとPeakの違いがあるため）。
    // ここでは簡易的に「スライダーの位置」を視覚化するだけに留める、または
    // dBをリニアにマップして描画する。
    // ユーザー体験としては「スライダーを下げると線が下がる」がわかりやすい。
    
    const thVal = parseFloat(sThreshold.value); // -60 to -10
    // Map -60...-10 to h...0 (roughly)
    // -60dB -> Bottom (h), 0dB -> Center (h/2) ... actually 0dB is max volume.
    // Linear mapping for UI feedback:
    // min: -60, max: -10. range: 50.
    const ratio = (thVal - (-60)) / 50; // 0.0 to 1.0
    // lineY should be near center when loud (-10), near edge when quiet (-60)
    // amplitude 0 is at h/2. max amplitude is at 0 and h.
    // Let's visualize the threshold relative to the wave height visually
    
    const lineY_top = h/2 - (h/2 * ratio);
    const lineY_btm = h/2 + (h/2 * ratio);

    ctx.beginPath();
    ctx.strokeStyle = '#4aa3ff'; // Accent Blue
    ctx.setLineDash([4, 4]);
    ctx.moveTo(0, lineY_top); ctx.lineTo(w, lineY_top);
    ctx.moveTo(0, lineY_btm); ctx.lineTo(w, lineY_btm);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  waveformCanvas.addEventListener('click', (e) => {
    if(!audioBuffer) return;
    const rect = waveformCanvas.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    previewPlayer.currentTime = ratio * audioBuffer.duration;
  });

  // --- Render List ---
  function renderList() {
    segmentsList.innerHTML = '';
    document.getElementById('segmentCount').innerText = `${detectedSegments.length} 箇所`;
    
    detectedSegments.forEach((seg, idx) => {
      const row = document.createElement('div');
      row.className = 'segment-row';
      row.innerHTML = `
        <span class="row-id">#${idx+1}</span>
        <span class="row-time">${seg.start.toFixed(2)}s - ${seg.end.toFixed(2)}s</span>
        <span class="row-dur">${(seg.end - seg.start).toFixed(2)}s</span>
      `;
      row.onclick = () => {
        previewPlayer.currentTime = seg.start;
        previewPlayer.play();
      };
      segmentsList.appendChild(row);
    });
  }

  // --- Preview ---
  previewCutBtn.addEventListener('click', () => {
    if(detectedSegments.length === 0) return;
    isPreviewingCuts = true;
    previewCutBtn.style.display = 'none';
    stopPreviewBtn.style.display = 'inline-block';
    
    previewPlayer.currentTime = detectedSegments[0].start;
    previewPlayer.play();
    checkPlayHead();
  });

  stopPreviewBtn.addEventListener('click', () => {
    isPreviewingCuts = false;
    previewPlayer.pause();
    stopPreviewBtn.style.display = 'none';
    previewCutBtn.style.display = 'inline-block';
    clearTimeout(previewTimeout);
  });

  function checkPlayHead() {
    if (!isPreviewingCuts || previewPlayer.paused) return;
    
    const t = previewPlayer.currentTime;
    const curIdx = detectedSegments.findIndex(s => t >= s.start && t < s.end);
    
    if (curIdx !== -1) {
      const seg = detectedSegments[curIdx];
      if (seg.end - t < 0.1) {
        if (curIdx + 1 < detectedSegments.length) {
          previewPlayer.currentTime = detectedSegments[curIdx + 1].start;
        } else {
          stopPreviewBtn.click();
          return;
        }
      }
    } else {
      const next = detectedSegments.find(s => s.start > t);
      if (next) previewPlayer.currentTime = next.start;
      else stopPreviewBtn.click();
    }
    previewTimeout = setTimeout(checkPlayHead, 50);
  }

  // --- Export ---
  exportBtn.addEventListener('click', async () => {
    if (!ffmpeg) await initFFmpeg();
    if (!ffmpeg.isLoaded()) { log("FFmpeg未ロード"); return; }
    
    exportBtn.disabled = true;
    setStatus("エンコード準備中...", true);
    
    try {
      const { fetchFile } = FFmpeg;
      const inName = 'input.mp4';
      const outName = 'output.mp4';
      
      ffmpeg.FS('writeFile', inName, await fetchFile(rawFile));
      
      // Filter Build
      let filter = "";
      let maps = "";
      detectedSegments.forEach((s, i) => {
        const start = s.start.toFixed(3);
        const end = s.end.toFixed(3);
        filter += `[0:v]trim=${start}:${end},setpts=PTS-STARTPTS[v${i}];`;
        filter += `[0:a]atrim=${start}:${end},asetpts=PTS-STARTPTS[a${i}];`;
        maps += `[v${i}][a${i}]`;
      });
      filter += `${maps}concat=n=${detectedSegments.length}:v=1:a=1[out]`;

      log("エンコード開始...");
      await ffmpeg.run(
        '-i', inName,
        '-filter_complex', filter,
        '-map', '[out]',
        '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
        '-c:a', 'aac',
        outName
      );
      
      log("エンコード完了");
      setStatus("完了", false);
      
      const data = ffmpeg.FS('readFile', outName);
      const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
      
      downloadBtn.href = url;
      downloadBtn.download = `cut_${rawFile.name}`;
      downloadBtn.style.display = 'block';
      
      ffmpeg.FS('unlink', inName); ffmpeg.FS('unlink', outName);

    } catch (e) {
      console.error(e);
      log("エラー発生: " + e.message);
      setStatus("エラー", false);
    } finally {
      exportBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
