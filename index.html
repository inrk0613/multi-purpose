<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silence Cutter Pro - ブラウザ完結型 自動無音カットツール</title>
    
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FFmpeg.wasm Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.6/dist/ffmpeg-core.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Styles */
        :root {
            --primary-color: #3b82f6;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }
        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            cursor: pointer;
            border-radius: 50%;
        }
        .slider-thumb::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            cursor: pointer;
            border-radius: 50%;
        }
        /* Canvas Layering */
        .waveform-container {
            position: relative;
            height: 120px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #progress-bar {
            background: rgba(255, 255, 255, 0.2);
            height: 100%;
            width: 2px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }
        /* Loading Overlay */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-lg z-20">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-scissors text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold text-white">Silence Cutter Pro <span class="text-xs font-normal text-gray-400 ml-2">Client-side Processing</span></h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-load-ffmpeg" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-gray-300 transition">
                <i class="fa-solid fa-server mr-1"></i> System Status
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Left Panel: Viewer & Timeline -->
        <div class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto relative">
            
            <!-- File Drop Zone -->
            <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-lg h-32 flex flex-col items-center justify-center bg-slate-800/50 hover:bg-slate-800 hover:border-blue-500 transition cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                <p class="text-gray-300 font-medium">動画ファイルをドラッグ＆ドロップ</p>
                <p class="text-gray-500 text-sm mt-1">対応形式: .mp4, .mov (iPad/iPhone対応)</p>
                <input type="file" id="file-input" class="hidden" accept="video/mp4,video/quicktime,video/x-m4v">
            </div>

            <!-- Video Player -->
            <div class="aspect-video bg-black rounded-lg shadow-2xl flex items-center justify-center overflow-hidden relative group">
                <video id="main-video" class="w-full h-full object-contain" playsinline></video>
                <div id="video-placeholder" class="absolute text-gray-600 flex flex-col items-center">
                    <i class="fa-solid fa-film text-6xl mb-4"></i>
                    <span>No Video Loaded</span>
                </div>
            </div>

            <!-- Waveform Visualization -->
            <div class="bg-slate-800 p-3 rounded-lg shadow-md flex flex-col gap-2">
                <div class="flex justify-between text-xs text-gray-400">
                    <span>Waveform & Cuts</span>
                    <span id="time-display">00:00 / 00:00</span>
                </div>
                <div class="waveform-container cursor-crosshair" id="waveform-wrapper">
                    <canvas id="wave-canvas"></canvas>
                    <div id="progress-bar"></div>
                </div>
                <div class="flex justify-center gap-4 mt-2">
                    <button id="btn-play" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button id="btn-stop" class="w-12 h-12 rounded-full bg-slate-600 hover:bg-slate-500 flex items-center justify-center text-white shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Settings -->
        <div class="w-full lg:w-96 bg-slate-800 border-l border-slate-700 flex flex-col shadow-xl z-10">
            <div class="p-4 border-b border-slate-700 bg-slate-900/50">
                <h2 class="font-semibold text-lg text-white"><i class="fa-solid fa-sliders mr-2 text-blue-400"></i>パラメータ設定</h2>
            </div>

            <div class="flex-1 p-6 flex flex-col gap-8 overflow-y-auto">
                
                <!-- Threshold Control -->
                <div class="control-group">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-gray-300">無音しきい値 (dB)</label>
                        <span id="val-threshold" class="text-sm font-mono text-blue-400">-30 dB</span>
                    </div>
                    <input type="range" id="input-threshold" min="-60" max="0" value="-30" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb">
                    <p class="text-xs text-gray-500 mt-1">この値より小さい音量をカットします。</p>
                </div>

                <!-- Min Duration Control -->
                <div class="control-group">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-gray-300">最小無音期間 (秒)</label>
                        <span id="val-duration" class="text-sm font-mono text-blue-400">0.5 s</span>
                    </div>
                    <input type="range" id="input-duration" min="0.1" max="2.0" step="0.1" value="0.5" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb">
                    <p class="text-xs text-gray-500 mt-1">これより短い無音は無視します。</p>
                </div>

                <!-- Padding Control -->
                <div class="control-group">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-gray-300">パディング (秒)</label>
                        <span id="val-padding" class="text-sm font-mono text-blue-400">0.2 s</span>
                    </div>
                    <input type="range" id="input-padding" min="0.0" max="1.0" step="0.05" value="0.2" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb">
                    <p class="text-xs text-gray-500 mt-1">カット前後の余韻を少し残します。</p>
                </div>

                <!-- Analysis Info -->
                <div class="bg-slate-700/50 rounded p-4 text-sm space-y-2 border border-slate-600">
                    <div class="flex justify-between">
                        <span class="text-gray-400">元の長さ:</span>
                        <span id="stat-original" class="font-mono text-white">00:00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">カット後の長さ:</span>
                        <span id="stat-estimated" class="font-mono text-green-400">00:00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">削減率:</span>
                        <span id="stat-ratio" class="font-mono text-blue-400">0%</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">カット数:</span>
                        <span id="stat-cuts" class="font-mono text-white">0</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="p-4 border-t border-slate-700 bg-slate-900">
                <button id="btn-export" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded shadow-lg flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-file-export"></i> 動画を書き出し (FFmpeg)
                </button>
                <p id="export-status" class="text-xs text-center text-gray-500 mt-2 min-h-[1.5em]">準備完了</p>
            </div>
        </div>
    </main>

    <!-- COI Service Worker Setup Script (Inline) -->
    <script>
        /*! coi-serviceworker v0.1.7 - MIT License */
        // This hack allows SharedArrayBuffer on GitHub Pages without server config
        if(window.crossOriginIsolated===false){const e=document.createElement("script");e.src=window.URL.createObjectURL(new Blob([`
            self.addEventListener("install", () => self.skipWaiting());
            self.addEventListener("activate", e => e.waitUntil(self.clients.claim()));
            self.addEventListener("fetch", function(e) {
                if (e.request.cache === "only-if-cached" && e.request.mode !== "same-origin") return;
                e.respondWith(fetch(e.request).then(r => {
                    if (r.status === 0) return r;
                    const headers = new Headers(r.headers);
                    headers.set("Cross-Origin-Embedder-Policy", "require-corp");
                    headers.set("Cross-Origin-Opener-Policy", "same-origin");
                    return new Response(r.body, { status: r.status, statusText: r.statusText, headers });
                }).catch(e => console.error(e)));
            });
        `],{type:"text/javascript"}));document.head.appendChild(e);
        if("serviceWorker"in navigator)navigator.serviceWorker.register(e.src).then(r=>console.log("COI-SW Registered")).catch(e=>console.error("COI-SW Failed",e));
        else window.location.reload()}
    </script>

    <!-- Application Logic -->
    <script>
        /**
         * Silence Cutter Pro - Core Application Logic
         * Designed for high performance and modularity.
         */

        // --- Constants & State ---
        const CONSTANTS = {
            FFMPEG_CORE_URL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.6/dist/ffmpeg-core.js',
            SAMPLE_RATE: 44100,
            FFT_SIZE: 2048,
            CANVAS_DENSITY: 2 // For retina displays
        };

        const STATE = {
            ffmpeg: null,
            file: null,
            audioBuffer: null,
            videoDuration: 0,
            segments: [], // Array of { start, end, keep }
            settings: {
                threshold: -30, // dB
                minDuration: 0.5, // seconds
                padding: 0.2 // seconds
            },
            isPlaying: false,
            isProcessing: false,
            animationFrameId: null
        };

        // --- Elements ---
        const UI = {
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            video: document.getElementById('main-video'),
            videoPlaceholder: document.getElementById('video-placeholder'),
            canvas: document.getElementById('wave-canvas'),
            progressBar: document.getElementById('progress-bar'),
            timeDisplay: document.getElementById('time-display'),
            inputs: {
                threshold: document.getElementById('input-threshold'),
                duration: document.getElementById('input-duration'),
                padding: document.getElementById('input-padding')
            },
            vals: {
                threshold: document.getElementById('val-threshold'),
                duration: document.getElementById('val-duration'),
                padding: document.getElementById('val-padding')
            },
            stats: {
                original: document.getElementById('stat-original'),
                estimated: document.getElementById('stat-estimated'),
                ratio: document.getElementById('stat-ratio'),
                cuts: document.getElementById('stat-cuts')
            },
            buttons: {
                play: document.getElementById('btn-play'),
                stop: document.getElementById('btn-stop'),
                export: document.getElementById('btn-export')
            },
            exportStatus: document.getElementById('export-status')
        };

        // --- 1. Audio Analysis Service ---
        class AudioService {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            async extractAudioBuffer(file) {
                const arrayBuffer = await file.arrayBuffer();
                return await this.audioContext.decodeAudioData(arrayBuffer);
            }

            /**
             * Calculates RMS amplitude for chunks of audio
             */
            analyzeVolume(audioBuffer) {
                const rawData = audioBuffer.getChannelData(0); // Use first channel
                const sampleRate = audioBuffer.sampleRate;
                const windowSize = Math.floor(sampleRate * 0.05); // 50ms windows
                const volumes = [];

                for (let i = 0; i < rawData.length; i += windowSize) {
                    let sum = 0;
                    const end = Math.min(i + windowSize, rawData.length);
                    for (let j = i; j < end; j++) {
                        sum += rawData[j] * rawData[j];
                    }
                    const rms = Math.sqrt(sum / (end - i));
                    // Convert to dB
                    const db = 20 * Math.log10(rms + 1e-10); // avoid log(0)
                    volumes.push({
                        time: i / sampleRate,
                        db: db,
                        rms: rms
                    });
                }
                return volumes;
            }
        }

        // --- 2. Segmentation Logic ---
        class SegmentProcessor {
            static calculateSegments(volumeData, settings, totalDuration) {
                const { threshold, minDuration, padding } = settings;
                const rawSegments = [];
                let isSilent = true;
                let startTime = 0;

                // 1. Identify raw silence/sound blocks
                for (let i = 0; i < volumeData.length; i++) {
                    const currentIsSilent = volumeData[i].db < threshold;
                    const currentTime = volumeData[i].time;

                    if (isSilent !== currentIsSilent) {
                        // Status changed
                        rawSegments.push({
                            start: startTime,
                            end: currentTime,
                            isSilent: isSilent
                        });
                        startTime = currentTime;
                        isSilent = currentIsSilent;
                    }
                }
                // Add last segment
                rawSegments.push({
                    start: startTime,
                    end: totalDuration,
                    isSilent: isSilent
                });

                // 2. Filter short silences (if silence < minDuration, treat as sound)
                // Also applies logic to ignore extremely short sound bursts if needed (omitted for now)
                const mergedSegments = [];
                for (let seg of rawSegments) {
                    if (seg.isSilent && (seg.end - seg.start) < minDuration) {
                        seg.isSilent = false; // Treat as sound
                    }
                    
                    // Merge with previous if same type
                    if (mergedSegments.length > 0 && mergedSegments[mergedSegments.length - 1].isSilent === seg.isSilent) {
                        mergedSegments[mergedSegments.length - 1].end = seg.end;
                    } else {
                        mergedSegments.push(seg);
                    }
                }

                // 3. Apply Padding
                // Extend 'sound' segments into 'silence' segments by padding amount
                const paddedSegments = [];
                for (let i = 0; i < mergedSegments.length; i++) {
                    let seg = { ...mergedSegments[i] };
                    
                    if (!seg.isSilent) {
                        // It's sound, expand it
                        seg.start = Math.max(0, seg.start - padding);
                        seg.end = Math.min(totalDuration, seg.end + padding);
                    }
                    paddedSegments.push(seg);
                }

                // 4. Final Cleanup & Inversion (We need list of KEEPS)
                // Since padded segments might overlap, we need to flatten the time ranges.
                // Simplest way: Construct a "Keep Mask" logic?
                // Better: Just iterate and merge overlapping "Keep" regions.
                
                let keepSegments = [];
                for (let seg of paddedSegments) {
                    if (!seg.isSilent) {
                        // Try to merge with last keep segment
                        if (keepSegments.length > 0) {
                            const last = keepSegments[keepSegments.length - 1];
                            if (seg.start <= last.end) {
                                last.end = Math.max(last.end, seg.end);
                            } else {
                                keepSegments.push(seg);
                            }
                        } else {
                            keepSegments.push(seg);
                        }
                    }
                }

                return keepSegments; // These are the parts to PLAY
            }
        }

        // --- 3. Visualization Service ---
        class Visualizer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * CONSTANTS.CANVAS_DENSITY;
                this.canvas.height = rect.height * CONSTANTS.CANVAS_DENSITY;
                this.width = rect.width;
                this.height = rect.height;
                this.ctx.scale(CONSTANTS.CANVAS_DENSITY, CONSTANTS.CANVAS_DENSITY);
            }

            draw(volumeData, keepSegments, currentVideoTime) {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;
                const totalTime = STATE.videoDuration || 1;

                // Clear
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, w, h);

                if (!volumeData || volumeData.length === 0) return;

                // Draw Background (Red for Silence / Cut)
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)'; // Red
                ctx.fillRect(0, 0, w, h);

                // Draw Keep Segments (Green background)
                ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; // Green
                keepSegments.forEach(seg => {
                    const x = (seg.start / totalTime) * w;
                    const gw = ((seg.end - seg.start) / totalTime) * w;
                    ctx.fillRect(x, 0, gw, h);
                });

                // Draw Waveform
                ctx.beginPath();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                
                const barWidth = w / volumeData.length;
                
                // Optimization: Don't draw every point if too dense
                const step = Math.max(1, Math.floor(volumeData.length / w)); 

                ctx.beginPath();
                for (let i = 0; i < volumeData.length; i += step) {
                    const x = (volumeData[i].time / totalTime) * w;
                    // Normalize dB -60 to 0 -> 0 to 1 height
                    let nHeight = (volumeData[i].db + 60) / 60;
                    if (nHeight < 0) nHeight = 0;
                    if (nHeight > 1) nHeight = 1;
                    
                    const y = h - (nHeight * h);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // Update Progress Bar position DOM (more performant than canvas redraw for just a line)
                if (UI.progressBar) {
                    const pct = (currentVideoTime / totalTime) * 100;
                    UI.progressBar.style.left = `${pct}%`;
                }
            }
        }

        // --- 4. FFmpeg Service ---
        class FFmpegService {
            constructor() {
                this.ffmpeg = FFmpeg.createFFmpeg({
                    log: true,
                    corePath: CONSTANTS.FFMPEG_CORE_URL
                });
                this.loaded = false;
            }

            async load() {
                if (this.loaded) return;
                try {
                    await this.ffmpeg.load();
                    this.loaded = true;
                    console.log("FFmpeg loaded");
                    document.getElementById('btn-load-ffmpeg').innerHTML = '<i class="fa-solid fa-check text-green-400"></i> System Ready';
                } catch (e) {
                    console.error(e);
                    document.getElementById('btn-load-ffmpeg').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i> Error';
                    alert("FFmpegのロードに失敗しました。ブラウザがSharedArrayBufferに対応していない可能性があります。");
                }
            }

            async processVideo(file, segments, progressCallback) {
                if (!this.loaded) await this.load();
                const { name } = file;
                
                this.ffmpeg.FS('writeFile', 'input.mp4', await FFmpeg.fetchFile(file));

                // Build complex filter
                // strategy: use 'select' filter to keep frames? Or trim/concat.
                // trim/concat is more precise for audio/video sync but command is long.
                // select='between(t,s,e)+between(t,s2,e2)...'
                // For audio: aselect='...'
                
                // Generate Filter String
                const videoSelects = segments.map(s => `between(t,${s.start},${s.end})`).join('+');
                const audioSelects = segments.map(s => `between(t,${s.start},${s.end})`).join('+');

                if(videoSelects.length === 0) {
                    throw new Error("残る部分がありません。");
                }

                // Note: select filter keeps timestamps, so we need 'setpts=N/FRAME_RATE/TB' and 'asetpts=N/SR/TB' to squeeze them together.
                // Actually, setpts=PTS-STARTPTS doesn't squeeze. 
                // Correct approach for cuts: trim -> setpts -> concat. But huge command.
                // Better approach for select: "select='...',setpts=N/FRAME_RATE/TB" works if using N (number of selected frames).
                
                // Let's use the robust `segment` approach is too complex for single file.
                // We will use the `select` filter approach which is fastest for preview-like renders, 
                // but `setpts=N/FRAME_RATE/TB` is tricky with VFR.
                // Let's use the standard trim-concat filter generator. It handles AV sync best.
                
                let filterComplex = "";
                let inputs = "";
                
                // Warning: If too many segments, command line limit might be hit.
                // For a demo, we limit to chunks or warn.
                if (segments.length > 100) {
                   if(!confirm("カット数が多すぎます(100箇所以上)。処理に時間がかかるか、失敗する可能性があります。続行しますか？")) return;
                }

                segments.forEach((seg, i) => {
                    // Video trim
                    filterComplex += `[0:v]trim=start=${seg.start}:end=${seg.end},setpts=PTS-STARTPTS[v${i}];`;
                    // Audio trim
                    filterComplex += `[0:a]atrim=start=${seg.start}:end=${seg.end},asetpts=PTS-STARTPTS[a${i}];`;
                });

                segments.forEach((_, i) => {
                    inputs += `[v${i}][a${i}]`;
                });
                
                filterComplex += `${inputs}concat=n=${segments.length}:v=1:a=1[outv][outa]`;

                const command = [
                    '-i', 'input.mp4',
                    '-filter_complex', filterComplex,
                    '-map', '[outv]', '-map', '[outa]',
                    '-c:v', 'libx264', // Re-encode needed for frame accuracy
                    '-preset', 'superfast', // Speed over size
                    '-c:a', 'aac',
                    'output.mp4'
                ];

                UI.exportStatus.innerText = "エンコード中... (ブラウザを閉じないでください)";
                
                await this.ffmpeg.run(...command);

                const data = this.ffmpeg.FS('readFile', 'output.mp4');
                
                // Cleanup
                try {
                    this.ffmpeg.FS('unlink', 'input.mp4');
                    this.ffmpeg.FS('unlink', 'output.mp4');
                } catch(e){}

                return new Blob([data.buffer], { type: 'video/mp4' });
            }
        }

        // --- 5. Main Controller ---
        const audioService = new AudioService();
        const visualizer = new Visualizer(UI.canvas);
        const ffmpegService = new FFmpegService();
        let volumeData = [];

        // Initialize
        (async () => {
            // Preload ffmpeg if possible (idle)
            setTimeout(() => ffmpegService.load(), 1000);
        })();

        // --- Event Listeners ---

        // Drag & Drop
        UI.dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            UI.dropZone.classList.add('border-blue-500', 'bg-slate-800');
        });
        UI.dropZone.addEventListener('dragleave', e => {
            e.preventDefault();
            UI.dropZone.classList.remove('border-blue-500', 'bg-slate-800');
        });
        UI.dropZone.addEventListener('drop', e => {
            e.preventDefault();
            UI.dropZone.classList.remove('border-blue-500', 'bg-slate-800');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        UI.dropZone.addEventListener('click', () => UI.fileInput.click());
        UI.fileInput.addEventListener('change', e => {
            if (e.target.files.length) loadFile(e.target.files[0]);
        });

        async function loadFile(file) {
            UI.exportStatus.innerText = "解析中...";
            UI.buttons.export.disabled = true;
            UI.videoPlaceholder.classList.add('hidden');

            STATE.file = file;
            const url = URL.createObjectURL(file);
            UI.video.src = url;

            // Wait for metadata to get duration
            await new Promise(r => UI.video.onloadedmetadata = r);
            STATE.videoDuration = UI.video.duration;
            
            // Decode Audio
            const buffer = await audioService.extractAudioBuffer(file);
            STATE.audioBuffer = buffer;
            
            // Analyze Volume
            volumeData = audioService.analyzeVolume(buffer);
            
            UI.buttons.play.disabled = false;
            UI.buttons.stop.disabled = false;
            UI.buttons.export.disabled = false;
            UI.exportStatus.innerText = "準備完了";

            updateCalculation();
        }

        // Controls Changes
        Object.keys(UI.inputs).forEach(key => {
            UI.inputs[key].addEventListener('input', (e) => {
                STATE.settings[key] = parseFloat(e.target.value);
                UI.vals[key].innerText = STATE.settings[key] + (key === 'threshold' ? ' dB' : ' s');
                updateCalculation();
            });
        });

        function updateCalculation() {
            if (!volumeData.length) return;

            STATE.segments = SegmentProcessor.calculateSegments(volumeData, STATE.settings, STATE.videoDuration);
            
            // Update Stats
            const keepDuration = STATE.segments.reduce((acc, seg) => acc + (seg.end - seg.start), 0);
            const ratio = ((1 - (keepDuration / STATE.videoDuration)) * 100).toFixed(1);
            
            UI.stats.original.innerText = formatTime(STATE.videoDuration);
            UI.stats.estimated.innerText = formatTime(keepDuration);
            UI.stats.ratio.innerText = ratio + '%';
            UI.stats.cuts.innerText = STATE.segments.length;

            visualizer.draw(volumeData, STATE.segments, UI.video.currentTime);
        }

        // Playback Logic (The "Jump Cut" Preview)
        UI.buttons.play.addEventListener('click', () => {
            if (UI.video.paused) {
                UI.video.play();
                animate();
                UI.buttons.play.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                UI.video.pause();
                cancelAnimationFrame(STATE.animationFrameId);
                UI.buttons.play.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        });

        UI.buttons.stop.addEventListener('click', () => {
            UI.video.pause();
            UI.video.currentTime = 0;
            cancelAnimationFrame(STATE.animationFrameId);
            UI.buttons.play.innerHTML = '<i class="fa-solid fa-play"></i>';
            visualizer.draw(volumeData, STATE.segments, 0);
        });

        // Sync Timeline Click
        UI.canvas.addEventListener('click', (e) => {
            if (!STATE.videoDuration) return;
            const rect = UI.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const clickTime = (x / rect.width) * STATE.videoDuration;
            UI.video.currentTime = clickTime;
            visualizer.draw(volumeData, STATE.segments, clickTime);
        });

        function animate() {
            if (UI.video.paused) return;

            const t = UI.video.currentTime;
            
            // Check if we are in a "Cut" zone (i.e., NOT in a keep segment)
            const isInKeep = STATE.segments.some(seg => t >= seg.start && t < seg.end);
            
            if (!isInKeep) {
                // Find next keep segment
                const nextSeg = STATE.segments.find(seg => seg.start > t);
                if (nextSeg) {
                    UI.video.currentTime = nextSeg.start; // Jump!
                } else {
                    // End of video content
                    if(STATE.segments.length > 0 && t > STATE.segments[STATE.segments.length-1].end){
                        UI.video.pause();
                        UI.buttons.play.innerHTML = '<i class="fa-solid fa-play"></i>';
                    }
                }
            }

            UI.timeDisplay.innerText = formatTime(t) + " / " + formatTime(STATE.videoDuration);
            visualizer.draw(volumeData, STATE.segments, t);
            STATE.animationFrameId = requestAnimationFrame(animate);
        }

        // Export
        UI.buttons.export.addEventListener('click', async () => {
            if (STATE.isProcessing) return;
            STATE.isProcessing = true;
            UI.buttons.export.disabled = true;
            
            try {
                const blob = await ffmpegService.processVideo(STATE.file, STATE.segments);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'edited_' + STATE.file.name;
                a.click();
                UI.exportStatus.innerText = "書き出し完了！";
            } catch (e) {
                console.error(e);
                UI.exportStatus.innerText = "エラー: " + e.message;
                alert("書き出し中にエラーが発生しました。コンソールを確認してください。");
            } finally {
                STATE.isProcessing = false;
                UI.buttons.export.disabled = false;
            }
        });

        // Utils
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 10);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms}`;
        }

    </script>
</body>
