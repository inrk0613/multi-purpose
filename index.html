<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無音区間オートカット Pro</title>

  <!-- ffmpeg.wasm (CDN) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Service Worker (COOP/COEP) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./coi-serviceworker.js').catch(e=>{});
      });
    }
  </script>

  <style>
    :root {
      /* --- Dark Mode (Default) --- */
      --bg-body: #050505;
      --bg-grad-1: #1a1f2c;
      --bg-grad-2: #000000;
      
      /* Liquid Glass Variables */
      --glass-bg: rgba(20, 25, 35, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      
      --primary: #8DC21F;
      --primary-hover: #a3db2e;
      --accent: #4aa3ff;
      
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-logo: #e2e8f0; /* Logo text color */
      
      --input-bg: rgba(0, 0, 0, 0.3);
      --radius: 16px; /* Apple-like rounded corners */
      
      --font-base: "Noto Sans JP", "Inter", sans-serif;
      --font-mono: "Roboto Mono", monospace;
    }

    /* --- Light Mode Override --- */
    body.light-mode {
      --bg-body: #f0f2f5;
      --bg-grad-1: #e0eafc;
      --bg-grad-2: #cfdef3;
      
      /* Apple-like Frosted Glass */
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      
      --primary: #7cb113; /* Slightly darker for contrast */
      --primary-hover: #8DC21F;
      --accent: #007aff; /* Apple Blue */
      
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --text-logo: #1d1d1f;
      
      --input-bg: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

    body {
      margin: 0;
      background: radial-gradient(circle at top left, var(--bg-grad-1), var(--bg-grad-2));
      color: var(--text-main);
      font-family: var(--font-base);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient Background Orb (Decoration) */
    .bg-orb {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      opacity: 0.15;
      top: -200px; right: -100px;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }

    /* --- Header --- */
    header {
      height: 64px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }
    .header-inner {
      width: 100%; max-width: 1920px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { width: 130px; }
    .logo svg { width: 100%; height: auto; display: block; }
    
    /* Theme Toggle Button */
    .theme-toggle {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }
    .theme-toggle:hover { background: var(--glass-border); }

    /* --- Main Layout --- */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 0;
      overflow: hidden;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 1024px) {
      body { height: auto; overflow-y: auto; }
      main { display: flex; flex-direction: column; overflow: visible; }
      .panel-right { order: 1; height: auto; border-bottom: 1px solid var(--glass-border); }
      .panel-left { order: 2; height: auto; border-right: none; }
      .preview-container { max-height: 45vh; }
    }

    /* --- Panels (Liquid Glass Style) --- */
    .panel-left {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .panel-right {
      /* Right panel is slightly more transparent to show background */
      background: rgba(0,0,0,0.02); 
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex; align-items: center; gap: 8px;
    }
    h2::before { content: ''; width: 4px; height: 14px; background: var(--primary); border-radius: 2px; }

    /* --- Components --- */
    
    /* Card Style Mixin */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .drop-zone {
      @extend .glass-card;
      background: var(--input-bg);
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .drop-zone:hover { border-color: var(--primary); background: rgba(141,194,31,0.08); }
    .drop-zone-text { font-size: 14px; font-weight: 600; margin-top: 8px; color: var(--text-main); }

    /* Stats Card */
    .stats-card {
      background: linear-gradient(135deg, rgba(74, 163, 255, 0.1), rgba(74, 163, 255, 0.02));
      border: 1px solid rgba(74, 163, 255, 0.3);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(74, 163, 255, 0.1);
    }
    .stat-item { text-align: center; }
    .stat-label { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text-main); }
    .stat-arrow { color: var(--text-muted); font-size: 16px; padding: 0 8px; }
    .stat-saving { color: var(--primary); font-size: 12px; font-weight: bold; }

    /* Sliders Control Group */
    .control-group {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    .slider-item { margin-bottom: 20px; }
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
    .label-val { color: var(--accent); font-family: var(--font-mono); font-weight: 600; }
    
    input[type="range"] {
      width: 100%; -webkit-appearance: none; background: transparent; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%; height: 4px; background: var(--glass-border); border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 20px; width: 20px;
      border-radius: 50%; background: var(--text-main); margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.1s;
      border: 1px solid var(--glass-border);
    }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); background: var(--primary); border-color: transparent; }

    /* Waveform */
    .waveform-wrap {
      background: #080808; /* Keep waveform dark for contrast */
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      height: 110px; overflow: hidden;
      position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Preview Player */
    .preview-container {
      width: 100%; background: #000; border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      display: flex; justify-content: center; align-items: center;
      aspect-ratio: 16 / 9;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Buttons */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.02em;
    }
    .btn-primary { 
      background: var(--primary); color: #050505; 
      box-shadow: 0 4px 15px rgba(141, 194, 31, 0.3);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-primary:disabled { background: var(--input-bg); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
    
    .btn-secondary { 
      background: var(--input-bg); color: var(--text-main); 
      border: 1px solid var(--glass-border);
    }
    .btn-secondary:hover { background: var(--glass-border); }

    /* Export Area */
    .export-section {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius); 
      padding: 20px;
      box-shadow: var(--glass-shadow);
    }
    .progress-bar {
      height: 6px; background: var(--glass-border);
      border-radius: 3px; margin: 12px 0; overflow: hidden;
    }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
    
    .log-console {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
      height: 60px; overflow-y: auto; border-top: 1px solid var(--glass-border);
      padding-top: 8px; margin-top: 12px; line-height: 1.4;
    }
    
    #downloadBtn {
      display: none;
      text-decoration: none; text-align: center; 
      background: rgba(74, 163, 255, 0.1); color: var(--accent);
      padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
      margin-top: 12px; transition: 0.2s;
    }
    #downloadBtn:hover { background: rgba(74, 163, 255, 0.2); }
  </style>
</head>
<body>

  <div class="bg-orb"></div>

        ☀

    </div>
  </header>

  <main>
    <!-- Left Panel: Controls -->
    <div class="panel-left">
      
      <label class="drop-zone">
        <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none;">
        <div style="font-size:28px; margin-bottom:4px;">📂</div>
        <div class="drop-zone-text">動画ファイルを選択</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">タップ または ドラッグ＆ドロップ</div>
      </label>

      <div>
        <h2>音量解析</h2>
        <div class="waveform-wrap">
          <canvas id="waveformCanvas"></canvas>
        </div>
      </div>

      <!-- Real-time Stats -->
      <div class="stats-card">
        <div class="stat-item">
          <span class="stat-label">元の長さ</span>
          <span class="stat-value" id="statOriginal">--:--</span>
        </div>
        <div class="stat-arrow">➝</div>
        <div class="stat-item">
          <span class="stat-label">カット後</span>
          <span class="stat-value" id="statNew" style="color:var(--primary);">--:--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">短縮</span>
          <span class="stat-saving" id="statSaving"></span>
        </div>
      </div>

      <div class="control-group">
        <h2>パラメータ調整</h2>
        <div class="slider-item">
          <div class="slider-header">
            <span>しきい値 (Threshold)</span>
            <span class="label-val" id="thresholdVal">-30 dB</span>
          </div>
          <input type="range" id="threshold" min="-60" max="-10" value="-30" step="1">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span>最短発話時間</span>
            <span class="label-val" id="minDurationVal">0.3 s</span>
          </div>
          <input type="range" id="minDuration" min="0.1" max="2.0" value="0.3" step="0.1">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span>前後の余白</span>
            <span class="label-val" id="paddingVal">0.1 s</span>
          </div>
          <input type="range" id="padding" min="0.0" max="1.0" value="0.1" step="0.05">
        </div>

        <button id="analyzeBtn" class="btn btn-primary" style="margin-top:16px;" disabled>
          音量を解析
        </button>
      </div>
    </div>

    <!-- Right Panel: Preview & Output -->
    <div class="panel-right">
      
      <!-- Video Preview -->
      <div class="preview-container">
        <video id="previewPlayer" playsinline controls></video>
      </div>
      
      <div style="display:flex; gap:12px;">
        <button id="previewCutBtn" class="btn btn-secondary" disabled>▶ カット後プレビュー</button>
        <button id="stopPreviewBtn" class="btn btn-secondary" style="display:none; color:#ff6b6b;">■ 停止</button>
      </div>

      <!-- Export Section -->
      <div class="export-section" style="margin-top:auto;">
        <button id="exportBtn" class="btn btn-primary" disabled>
          動画を書き出し (自動保存)
        </button>
        
        <div class="progress-bar">
          <div id="exportProgress" class="progress-fill"></div>
        </div>
        <div id="exportStatus" style="font-size:12px; color:var(--text-muted); text-align:center; min-height:18px;"></div>
        
        <a id="downloadBtn" href="#" download>⬇ 手動ダウンロード</a>
        
        <div class="log-console" id="logConsole">System Ready.</div>
      </div>

    </div>
  </main>

  <script>
  // --- Theme Toggle ---
  const themeToggle = document.getElementById('themeToggle');
  let isDarkMode = true;

  themeToggle.addEventListener('click', () => {
    isDarkMode = !isDarkMode;
    if (isDarkMode) {
      document.body.classList.remove('light-mode');
      themeToggle.innerText = '☀';
    } else {
      document.body.classList.add('light-mode');
      themeToggle.innerText = '🌙';
    }
  });

  // Elements
  const fileInput = document.getElementById('fileInput');
  const previewPlayer = document.getElementById('previewPlayer');
  const waveformCanvas = document.getElementById('waveformCanvas');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const exportBtn = document.getElementById('exportBtn');
  const previewCutBtn = document.getElementById('previewCutBtn');
  const stopPreviewBtn = document.getElementById('stopPreviewBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const exportProgress = document.getElementById('exportProgress');
  const exportStatus = document.getElementById('exportStatus');
  const logConsole = document.getElementById('logConsole');

  // Stats Elements
  const statOriginal = document.getElementById('statOriginal');
  const statNew = document.getElementById('statNew');
  const statSaving = document.getElementById('statSaving');

  // Sliders
  const sThreshold = document.getElementById('threshold');
  const sMinDur = document.getElementById('minDuration');
  const sPadding = document.getElementById('padding');

  // State
  let ffmpeg = null;
  let audioBuffer = null;
  let rawFile = null;
  let detectedSegments = [];
  let isPreviewingCuts = false;
  let previewTimeout = null;

  // Utils
  const log = (msg) => {
    const t = new Date().toLocaleTimeString();
    logConsole.innerText = `[${t}] ${msg}\n` + logConsole.innerText;
  };
  
  const formatTime = (sec) => {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  };

  const updateStats = () => {
    if(!audioBuffer) return;
    const orig = audioBuffer.duration;
    let newDur = 0;
    detectedSegments.forEach(s => newDur += (s.end - s.start));
    
    statOriginal.innerText = formatTime(orig);
    statNew.innerText = formatTime(newDur);
    
    const saved = orig - newDur;
    const percent = orig > 0 ? Math.round((saved / orig) * 100) : 0;
    statSaving.innerText = `-${percent}%`;
  };

  // Slider Logic
  const updateSliderUI = (id, val, unit) => {
    document.getElementById(id + 'Val').innerText = val + unit;
  };

  [sThreshold, sMinDur, sPadding].forEach(el => {
    el.addEventListener('input', () => {
      updateSliderUI(el.id, el.value, el.id === 'threshold' ? ' dB' : ' s');
      if (audioBuffer) {
        const rawData = audioBuffer.getChannelData(0);
        drawWaveform(rawData); // Redraw for threshold line
      }
    });
    el.addEventListener('change', () => {
      if (audioBuffer) detectSilence();
    });
  });

  // FFmpeg Init
  const initFFmpeg = async () => {
    if (ffmpeg) return;
    const { createFFmpeg } = FFmpeg;
    ffmpeg = createFFmpeg({
      log: false,
      corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
      progress: ({ ratio }) => {
        if (ratio >= 0 && ratio <= 1) {
          exportProgress.style.width = `${ratio * 100}%`;
          exportStatus.innerText = `エンコード中... ${Math.round(ratio * 100)}%`;
        }
      }
    });
    await ffmpeg.load();
  };

  // File Input
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    rawFile = file;
    previewPlayer.src = URL.createObjectURL(file);
    
    // Reset
    audioBuffer = null;
    detectedSegments = [];
    exportBtn.disabled = true;
    previewCutBtn.disabled = true;
    downloadBtn.style.display = 'none';
    analyzeBtn.disabled = false;
    
    statOriginal.innerText = "--:--";
    statNew.innerText = "--:--";
    statSaving.innerText = "";

    const ctx = waveformCanvas.getContext('2d');
    ctx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
    document.querySelector('.drop-zone-text').innerText = file.name;
  });

  // Analyze
  analyzeBtn.addEventListener('click', async () => {
    if (!rawFile) return;
    analyzeBtn.disabled = true;
    log("解析中...");
    
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      try {
        const ab = await rawFile.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(ab.slice(0));
      } catch (e) {
        log("FFmpegで解析用音声を抽出中...");
        audioBuffer = await decodeWithFFmpeg(rawFile, audioCtx);
      }
      detectSilence();
      log("解析完了");
    } catch (e) {
      log("解析エラー: " + e.message);
    } finally {
      analyzeBtn.disabled = false;
    }
  });

  async function decodeWithFFmpeg(file, audioCtx) {
    if (!ffmpeg) await initFFmpeg();
    const { fetchFile } = FFmpeg;
    ffmpeg.FS('writeFile', 'temp.mov', await fetchFile(file));
    await ffmpeg.run('-i', 'temp.mov', '-vn', '-acodec', 'pcm_s16le', '-ar', '44100', '-ac', '1', 'out.wav');
    const data = ffmpeg.FS('readFile', 'out.wav');
    ffmpeg.FS('unlink', 'temp.mov'); ffmpeg.FS('unlink', 'out.wav');
    return await audioCtx.decodeAudioData(data.buffer);
  }

  // Detect
  function detectSilence() {
    if (!audioBuffer) return;
    const rawData = audioBuffer.getChannelData(0);
    const sr = audioBuffer.sampleRate;
    const thDB = parseFloat(sThreshold.value);
    const minDur = parseFloat(sMinDur.value);
    const pad = parseFloat(sPadding.value);
    
    const winSize = Math.floor(sr * 0.05);
    const segments = [];
    let isSpeaking = false;
    let startFrame = 0;
    
    for (let i = 0; i < rawData.length; i += winSize) {
      let sum = 0;
      const end = Math.min(i + winSize, rawData.length);
      for (let j = i; j < end; j++) sum += rawData[j] * rawData[j];
      const rms = Math.sqrt(sum / (end - i));
      const db = 20 * Math.log10(rms);
      
      const isLoud = db > thDB;
      if (isLoud && !isSpeaking) {
        isSpeaking = true; startFrame = i;
      } else if (!isLoud && isSpeaking) {
        isSpeaking = false; segments.push({ start: startFrame/sr, end: i/sr });
      }
    }
    if (isSpeaking) segments.push({ start: startFrame/sr, end: rawData.length/sr });

    let merged = [];
    if (segments.length > 0) {
      let cur = { start: Math.max(0, segments[0].start - pad), end: segments[0].end + pad };
      for (let k = 1; k < segments.length; k++) {
        const nS = Math.max(0, segments[k].start - pad);
        const nE = segments[k].end + pad;
        if (nS <= cur.end) cur.end = Math.max(cur.end, nE);
        else {
          if (cur.end - cur.start >= minDur) merged.push(cur);
          cur = { start: nS, end: nE };
        }
      }
      if (cur.end - cur.start >= minDur) merged.push(cur);
    }
    
    detectedSegments = merged.map(s => ({
      start: Math.max(0, s.start),
      end: Math.min(audioBuffer.duration, s.end)
    }));
    
    drawWaveform(rawData);
    updateStats();
    
    const valid = detectedSegments.length > 0;
    exportBtn.disabled = !valid;
    previewCutBtn.disabled = !valid;
  }

  // Draw Wave & Threshold
  function drawWaveform(data) {
    const ctx = waveformCanvas.getContext('2d');
    const w = waveformCanvas.width = waveformCanvas.offsetWidth;
    const h = waveformCanvas.height = waveformCanvas.offsetHeight;
    ctx.clearRect(0,0,w,h); 
    
    // BG: depends on mode? Let's keep it dark for contrast or use semi-transparent
    // For waveform visibility, a dark background is usually best even in light mode
    ctx.fillStyle = '#080808'; 
    ctx.fillRect(0,0,w,h);
    
    let maxAmp = 0;
    for (let i=0; i<data.length; i+=100) { const v = Math.abs(data[i]); if(v>maxAmp) maxAmp=v; }
    const scale = (h/2)*0.9 / (maxAmp || 1);

    ctx.beginPath(); ctx.strokeStyle='#8DC21F'; ctx.lineWidth=1;
    const step = Math.ceil(data.length/w);
    for(let x=0; x<w; x++) {
      const val = data[x*step]||0;
      const y = val * scale;
      ctx.moveTo(x, h/2 - y); ctx.lineTo(x, h/2 + y);
    }
    ctx.stroke();

    // Segments
    ctx.fillStyle='rgba(141,194,31,0.25)';
    const totalSec = data.length / audioBuffer.sampleRate;
    detectedSegments.forEach(s => {
      const x = (s.start/totalSec)*w;
      const wid = ((s.end-s.start)/totalSec)*w;
      ctx.fillRect(x,0,wid,h);
    });

    // Threshold Line
    const thVal = parseFloat(sThreshold.value);
    const ratio = (thVal - (-60)) / 50;
    const ly = h/2 - (h/2 * ratio);
    ctx.beginPath(); ctx.strokeStyle='#4aa3ff'; ctx.setLineDash([4,4]);
    ctx.moveTo(0,ly); ctx.lineTo(w,ly);
    ctx.moveTo(0,h-ly); ctx.lineTo(w,h-ly);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Preview
  previewCutBtn.addEventListener('click', () => {
    if(!detectedSegments.length) return;
    isPreviewingCuts = true;
    previewCutBtn.style.display = 'none'; stopPreviewBtn.style.display = 'inline-block';
    previewPlayer.currentTime = detectedSegments[0].start;
    previewPlayer.play(); checkPlayHead();
  });
  stopPreviewBtn.addEventListener('click', () => {
    isPreviewingCuts = false; previewPlayer.pause();
    stopPreviewBtn.style.display = 'none'; previewCutBtn.style.display = 'inline-block';
    clearTimeout(previewTimeout);
  });
  function checkPlayHead() {
    if(!isPreviewingCuts || previewPlayer.paused) return;
    const t = previewPlayer.currentTime;
    const idx = detectedSegments.findIndex(s => t>=s.start && t<s.end);
    if(idx !== -1) {
      if(detectedSegments[idx].end - t < 0.1) {
        if(idx+1 < detectedSegments.length) previewPlayer.currentTime = detectedSegments[idx+1].start;
        else stopPreviewBtn.click();
      }
    } else {
      const next = detectedSegments.find(s => s.start > t);
      if(next) previewPlayer.currentTime = next.start; else stopPreviewBtn.click();
    }
    previewTimeout = setTimeout(checkPlayHead, 50);
  }

  // Export & Auto Download
  exportBtn.addEventListener('click', async () => {
    if(!ffmpeg) await initFFmpeg();
    exportBtn.disabled = true;
    exportStatus.innerText = "書き出し準備中...";
    
    try {
      const { fetchFile } = FFmpeg;
      ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(rawFile));
      
      let filter = ""; let maps = "";
      detectedSegments.forEach((s,i) => {
        filter += `[0:v]trim=${s.start.toFixed(3)}:${s.end.toFixed(3)},setpts=PTS-STARTPTS[v${i}];`;
        filter += `[0:a]atrim=${s.start.toFixed(3)}:${s.end.toFixed(3)},asetpts=PTS-STARTPTS[a${i}];`;
        maps += `[v${i}][a${i}]`;
      });
      filter += `${maps}concat=n=${detectedSegments.length}:v=1:a=1[out]`;

      await ffmpeg.run('-i','input.mp4','-filter_complex',filter,'-map','[out]','-c:v','libx264','-preset','ultrafast','-crf','23','-c:a','aac','output.mp4');
      
      exportStatus.innerText = "完了！保存中...";
      const data = ffmpeg.FS('readFile', 'output.mp4');
      const blob = new Blob([data.buffer], {type: 'video/mp4'});
      const url = URL.createObjectURL(blob);
      
      downloadBtn.href = url;
      downloadBtn.download = `cut_${rawFile.name}`;
      downloadBtn.style.display = 'block';
      downloadBtn.innerText = "⬇ ファイルを再ダウンロード";
      
      setTimeout(() => { downloadBtn.click(); }, 500);

      ffmpeg.FS('unlink','input.mp4'); ffmpeg.FS('unlink','output.mp4');

    } catch(e) {
      console.error(e); exportStatus.innerText = "エラー発生";
    } finally {
      exportBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
