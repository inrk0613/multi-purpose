<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無音区間オートカット (ffmpeg.wasm)</title>
  
  <!-- PWA / アイコン設定（必要に応じてファイルを配置してください） -->
  <!-- <link rel="icon" href="./favicon.ico" /> -->

  <!-- ffmpeg.wasm (CDN) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <!-- Service Worker 登録 (COOP/COEP対策) -->
  <script>
    if ('serviceWorker' in navigator) {
      // ページロード時に登録
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./coi-serviceworker.js').then(reg => {
          console.log('COOP/COEP Service Worker registered', reg);
        }).catch(err => {
          console.error('Service Worker registration failed', err);
        });
      });
      
      // 初回アクセス時はSWが有効化されていないため、リロードが必要な場合がある
      // 通常は window.isSecureContext && crossOriginIsolated で判定
      if (!window.crossOriginIsolated) {
        console.warn("SharedArrayBuffer is not isolated. Reloading page...");
        // 無限ループ防止のためsessionStorageなどを使うのが一般的ですが、
        // SW登録直後は自動リロードするライブラリ(coi-serviceworker)の挙動に任せるか、
        // ユーザーに「リロードしてください」と表示するのが安全です。
      }
    }
  </script>

  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --primary: #bb86fc;
      --secondary: #03dac6;
      --error: #cf6679;
      --text: #e0e0e0;
      --subtext: #a0a0a0;
      --border: #333;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media(min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      .full-width {
        grid-column: span 2;
      }
    }
    h1, h2, h3 { margin-top: 0; color: var(--primary); }
    
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--subtext); }
    
    /* Inputs & Buttons */
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #2c2c2c;
      border-radius: 6px;
      color: var(--text);
    }
    button {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
      opacity: 0.7;
    }
    button:hover:not(:disabled) { opacity: 0.9; }
    
    .btn-secondary { background: var(--secondary); }
    
    /* Sliders */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .slider-row input { flex: 1; }
    .slider-val { width: 60px; text-align: right; font-family: monospace; }

    /* Visuals */
    canvas {
      width: 100%;
      height: 100px;
      background: #000;
      border-radius: 4px;
      margin-top: 10px;
      cursor: crosshair;
    }
    
    video {
      width: 100%;
      border-radius: 6px;
      background: #000;
      max-height: 300px;
    }

    .segments-list {
      max-height: 200px;
      overflow-y: auto;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      margin-top: 10px;
      padding: 5px;
    }
    .segment-item {
      display: flex;
      justify-content: space-between;
      padding: 6px;
      border-bottom: 1px solid #222;
      font-size: 0.85rem;
    }
    .segment-item.excluded { opacity: 0.4; }

    .log-area {
      width: 100%;
      height: 150px;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      resize: vertical;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--secondary);
      width: 0%;
      transition: width 0.2s;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .warn { color: #ffb74d; }
    .err { color: var(--error); }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="full-width">
    <h1>無音区間オートカット</h1>
    <p style="color: var(--subtext); font-size: 0.9rem;">
      ブラウザ上で動画の無音部分（指定dB未満）を自動検出し、カットして書き出します。<br>
      ※ データはサーバーに送信されません。
    </p>
    <!-- COOP Check Alert -->
    <div id="coopAlert" style="display:none; background:var(--error); color:#000; padding:10px; border-radius:6px; margin-bottom:10px;">
      <strong>注意:</strong> SharedArrayBuffer が有効になっていません。ページをリロードするか、https接続を確認してください。
    </div>
  </div>

  <!-- Left Panel: Input & Analysis -->
  <div class="card">
    <h2>1. ファイル選択 & 解析</h2>
    <input type="file" id="fileInput" accept="video/*,audio/*" />
    
    <video id="previewPlayer" controls playsinline style="margin-top:10px; display:none;"></video>

    <div style="margin-top: 20px;">
      <label>無音判定しきい値 (dB)</label>
      <div class="slider-row">
        <input type="range" id="threshold" min="-60" max="-10" value="-30" step="1">
        <span class="slider-val" id="thresholdVal">-30 dB</span>
      </div>

      <label>最小発話時間 (秒) <small>※これより短い音は無視</small></label>
      <div class="slider-row">
        <input type="range" id="minDuration" min="0.1" max="2.0" value="0.3" step="0.1">
        <span class="slider-val" id="minDurationVal">0.3 s</span>
      </div>

      <label>前後の余白 (秒) <small>※カット箇所の違和感軽減</small></label>
      <div class="slider-row">
        <input type="range" id="padding" min="0.0" max="1.0" value="0.1" step="0.05">
        <span class="slider-val" id="paddingVal">0.1 s</span>
      </div>
    </div>

    <button id="analyzeBtn" disabled>音量を解析する</button>
    
    <div id="analyzeStatus" class="status-msg"></div>

    <canvas id="waveformCanvas" title="クリックでプレビュー位置移動"></canvas>
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#666;">
      <span>音量小 (-60dB)</span>
      <span>音量大 (0dB)</span>
    </div>
  </div>

  <!-- Right Panel: Edit & Export -->
  <div class="card">
    <h2>2. 確認 & 書き出し</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <button id="previewCutBtn" class="btn-secondary" disabled>▶ カット後をプレビュー</button>
      <button id="stopPreviewBtn" style="background:#444; display:none;">停止</button>
    </div>
    <small style="color:var(--subtext)">※プレビューはブラウザ上でシークしているだけなので、実際の書き出しと多少ズレる場合があります。</small>

    <h3>検出された区間 <span id="segmentCount" style="font-size:0.9rem; font-weight:normal;"></span></h3>
    <div class="segments-list" id="segmentsList">
      <div style="padding:10px; color:#666; text-align:center;">解析待ち...</div>
    </div>

    <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
      <button id="exportBtn" disabled>✂️ 動画を書き出す (エンコード)</button>
      
      <div class="progress-bar">
        <div id="exportProgress" class="progress-fill"></div>
      </div>
      <div id="exportStatus" class="status-msg"></div>
      
      <a id="downloadLink" style="display:none; margin-top:10px; color:var(--secondary);">⬇ ダウンロード</a>
    </div>
  </div>

  <!-- Log Area -->
  <div class="full-width card">
    <h3>FFmpeg Log</h3>
    <textarea id="ffmpegLog" class="log-area" readonly></textarea>
  </div>

</div>

<script>
// --- DOM Elements ---
const fileInput = document.getElementById('fileInput');
const previewPlayer = document.getElementById('previewPlayer');
const analyzeBtn = document.getElementById('analyzeBtn');
const exportBtn = document.getElementById('exportBtn');
const previewCutBtn = document.getElementById('previewCutBtn');
const stopPreviewBtn = document.getElementById('stopPreviewBtn');
const segmentsList = document.getElementById('segmentsList');
const waveformCanvas = document.getElementById('waveformCanvas');
const logArea = document.getElementById('ffmpegLog');
const downloadLink = document.getElementById('downloadLink');

// Sliders Elements
const sThreshold = document.getElementById('threshold');
const sMinDur = document.getElementById('minDuration');
const sPadding = document.getElementById('padding');

// Status Elements
const analyzeStatus = document.getElementById('analyzeStatus');
const exportStatus = document.getElementById('exportStatus');
const exportProgressBar = document.getElementById('exportProgress');

// --- Utils ---
const log = (msg) => {
  logArea.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logArea.scrollTop = logArea.scrollHeight;
};

const updateSliderVal = (id, val, unit) => {
  document.getElementById(id).textContent = val + unit;
};

// --- Slider Events (Corrected) ---
// 重複していた古いコードを削除し、正しい挙動のみを残しました
[sThreshold, sMinDur, sPadding].forEach(el => {
  // 1. ドラッグ中：数値の表示だけ更新（重い処理はしない）
  el.addEventListener('input', () => {
    updateSliderVal(el.id + 'Val', el.value, el.id === 'threshold' ? ' dB' : ' s');
  });

  // 2. 指/マウスを離した時：再計算を実行
  el.addEventListener('change', () => {
    // すでに音声がロード済みなら、再デコードせずに計算だけ回す
    if(audioBuffer) {
      log("Re-calculating segments...");
      detectSilence(); // 解析ロジックのみ実行（高速）
    }
  });
});

// --- State ---
let ffmpeg = null;
let audioBuffer = null; // Web Audio API buffer
let rawFile = null;
let detectedSegments = []; // {start, end}
let isPreviewingCuts = false;
let previewTimeout = null;

// --- Check Environment ---
if (!window.crossOriginIsolated) {
  document.getElementById('coopAlert').style.display = 'block';
  log("Warning: crossOriginIsolated is false. ffmpeg.wasm might fail.");
}

// --- 1. Initialize FFmpeg ---
const initFFmpeg = async () => {
  if (ffmpeg) return;
  const { createFFmpeg, fetchFile } = FFmpeg;
  
  log("Loading ffmpeg-core...");
  ffmpeg = createFFmpeg({
    log: true,
    corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
    progress: ({ ratio }) => {
      if(ratio >= 0 && ratio <= 1) {
        exportProgressBar.style.width = `${ratio * 100}%`;
        exportStatus.innerText = `処理中... ${(ratio * 100).toFixed(1)}%`;
      }
    }
  });
  
  try {
    await ffmpeg.load();
    log("FFmpeg loaded successfully.");
  } catch (e) {
    log("Error loading ffmpeg: " + e.message);
    alert("FFmpegのロードに失敗しました。ページをリロードしてみてください。");
  }
};

// --- 2. File Loading ---
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  rawFile = file;
  previewPlayer.src = URL.createObjectURL(file);
  previewPlayer.style.display = 'block';
  
  // Reset State
  audioBuffer = null;
  detectedSegments = [];
  waveformCanvas.getContext('2d').clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
  segmentsList.innerHTML = '<div style="padding:10px; color:#666; text-align:center;">解析待ち...</div>';
  
  analyzeBtn.disabled = false;
  exportBtn.disabled = true;
  previewCutBtn.disabled = true;
  downloadLink.style.display = 'none';
  
  analyzeStatus.innerText = "";
  log(`File selected: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`);
});

// --- 3. Analysis (Web Audio API & FFmpeg Fallback) ---
analyzeBtn.addEventListener('click', async () => {
  if (!rawFile) return;
  
  analyzeBtn.disabled = true;
  analyzeStatus.className = "status-msg";
  analyzeStatus.innerText = "音声をデコード中...";

  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // 【試行1】ブラウザ標準機能でデコードを試みる
    try {
      log("Attempting native decode...");
      const arrayBuffer = await rawFile.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
      log("Native decode successful.");
    } catch (nativeError) {
      log(`Native decode failed: ${nativeError.message}. Switching to FFmpeg fallback.`);
      analyzeStatus.innerText = "標準デコード失敗。FFmpegで変換して解析します...";
      
      // 【試行2】失敗した場合、FFmpegを使ってWAVに変換してから読み込む
      audioBuffer = await decodeWithFFmpeg(rawFile, audioCtx);
    }
    
    log(`Audio Ready. Duration: ${audioBuffer.duration.toFixed(2)}s`);
    
    detectSilence();
    analyzeStatus.innerText = "解析完了";

  } catch (e) {
    console.error(e);
    analyzeStatus.innerText = "解析エラー: " + e.message;
    analyzeStatus.className = "status-msg err";
    log("Fatal Error: " + e.message);
  } finally {
    analyzeBtn.disabled = false;
  }
});

// FFmpegを使って音声をWAVに変換し、AudioBufferとして返す関数
async function decodeWithFFmpeg(file, audioCtx) {
  if (!ffmpeg) {
    await initFFmpeg();
  }
  if (!ffmpeg.isLoaded()) {
    throw new Error("FFmpeg is not loaded.");
  }

  const { fetchFile } = FFmpeg;
  const inputName = 'temp_input.mov';
  const outputName = 'temp_audio.wav';

  log("FFmpeg: Extracting audio track...");
  ffmpeg.FS('writeFile', inputName, await fetchFile(file));

  await ffmpeg.run(
    '-i', inputName,
    '-vn',
    '-acodec', 'pcm_s16le',
    '-ar', '44100',
    '-ac', '1',
    outputName
  );

  const data = ffmpeg.FS('readFile', outputName);
  
  try {
    ffmpeg.FS('unlink', inputName);
    ffmpeg.FS('unlink', outputName);
  } catch(e) { /* 無視 */ }

  log("FFmpeg: Audio extracted. Decoding wav...");
  return await audioCtx.decodeAudioData(data.buffer);
}

// --- 4. Detect Silence Algorithm ---
function detectSilence() {
  if (!audioBuffer) return;

  const rawData = audioBuffer.getChannelData(0);
  const sampleRate = audioBuffer.sampleRate;
  
  const thresholdDB = parseFloat(sThreshold.value);
  const minDuration = parseFloat(sMinDur.value);
  const padding = parseFloat(sPadding.value);
  
  const windowSize = Math.floor(sampleRate * 0.05); // 50ms
  const segments = [];
  
  let isSpeaking = false;
  let startFrame = 0;
  
  for (let i = 0; i < rawData.length; i += windowSize) {
    let sum = 0;
    const end = Math.min(i + windowSize, rawData.length);
    for (let j = i; j < end; j++) {
      sum += rawData[j] * rawData[j];
    }
    const rms = Math.sqrt(sum / (end - i));
    const db = 20 * Math.log10(rms);
    
    const isLoud = db > thresholdDB;
    
    if (isLoud && !isSpeaking) {
      isSpeaking = true;
      startFrame = i;
    } else if (!isLoud && isSpeaking) {
      isSpeaking = false;
      segments.push({ start: startFrame / sampleRate, end: i / sampleRate });
    }
  }
  if (isSpeaking) {
    segments.push({ start: startFrame / sampleRate, end: rawData.length / sampleRate });
  }

  let merged = [];
  if (segments.length > 0) {
    let current = { 
      start: Math.max(0, segments[0].start - padding), 
      end: segments[0].end + padding 
    };
    
    for (let k = 1; k < segments.length; k++) {
      const nextStart = Math.max(0, segments[k].start - padding);
      const nextEnd = segments[k].end + padding;
      
      if (nextStart <= current.end) {
        current.end = Math.max(current.end, nextEnd);
      } else {
        if (current.end - current.start >= minDuration) {
          merged.push(current);
        }
        current = { start: nextStart, end: nextEnd };
      }
    }
    if (current.end - current.start >= minDuration) {
      merged.push(current);
    }
  }
  
  detectedSegments = merged.map(s => ({
    start: Math.max(0, s.start),
    end: Math.min(audioBuffer.duration, s.end)
  }));

  log(`Segments detected: ${detectedSegments.length}`);
  
  drawWaveform(rawData, sampleRate);
  renderSegmentList();
  
  if (detectedSegments.length > 0) {
    exportBtn.disabled = false;
    previewCutBtn.disabled = false;
  } else {
    exportBtn.disabled = true;
    previewCutBtn.disabled = true;
    // alert("有効な区間が見つかりませんでした。しきい値を調整してください。"); 
    // ↑スライダー操作中に毎回alertが出ると邪魔なのでコメントアウト推奨
  }
}

// --- 5. Visualization (Canvas) ---
function drawWaveform(data, sampleRate) {
  const ctx = waveformCanvas.getContext('2d');
  const w = waveformCanvas.width = waveformCanvas.offsetWidth;
  const h = waveformCanvas.height;
  
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, w, h);
  
  const step = Math.ceil(data.length / w);
  const amp = h / 2;
  
  ctx.beginPath();
  ctx.strokeStyle = '#555';
  for(let i=0; i < w; i++) {
    const idx = i * step;
    const val = data[idx] || 0;
    ctx.moveTo(i, amp - val * amp);
    ctx.lineTo(i, amp + val * amp);
  }
  ctx.stroke();
  
  ctx.fillStyle = 'rgba(3, 218, 198, 0.3)';
  const totalSeconds = data.length / sampleRate;
  
  detectedSegments.forEach(seg => {
    const x = (seg.start / totalSeconds) * w;
    const width = ((seg.end - seg.start) / totalSeconds) * w;
    ctx.fillRect(x, 0, width, h);
  });
}

waveformCanvas.addEventListener('click', (e) => {
  if(!audioBuffer) return;
  const rect = waveformCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const ratio = x / rect.width;
  const time = ratio * audioBuffer.duration;
  previewPlayer.currentTime = time;
});

// --- 6. Render UI List ---
function renderSegmentList() {
  segmentsList.innerHTML = '';
  document.getElementById('segmentCount').innerText = `(${detectedSegments.length}箇所)`;
  
  detectedSegments.forEach((seg, idx) => {
    const div = document.createElement('div');
    div.className = 'segment-item';
    div.innerHTML = `
      <span>#${idx+1}</span>
      <span>${seg.start.toFixed(2)}s 〜 ${seg.end.toFixed(2)}s</span>
      <span>(${(seg.end - seg.start).toFixed(2)}s)</span>
    `;
    div.onclick = () => {
      previewPlayer.currentTime = seg.start;
      previewPlayer.play();
    };
    div.style.cursor = 'pointer';
    div.title = "クリックで再生";
    segmentsList.appendChild(div);
  });
}

// --- 7. Preview Logic ---
previewCutBtn.addEventListener('click', () => {
  isPreviewingCuts = true;
  previewCutBtn.style.display = 'none';
  stopPreviewBtn.style.display = 'inline-block';
  
  if(detectedSegments.length > 0) {
    previewPlayer.currentTime = detectedSegments[0].start;
    previewPlayer.play();
    checkPlayHead();
  }
});

stopPreviewBtn.addEventListener('click', () => {
  isPreviewingCuts = false;
  previewPlayer.pause();
  previewCutBtn.style.display = 'inline-block';
  stopPreviewBtn.style.display = 'none';
  clearTimeout(previewTimeout);
});

function checkPlayHead() {
  if (!isPreviewingCuts) return;
  if (previewPlayer.paused) return;
  
  const t = previewPlayer.currentTime;
  const currentSegIndex = detectedSegments.findIndex(s => t >= s.start && t < s.end);
  
  if (currentSegIndex !== -1) {
    const seg = detectedSegments[currentSegIndex];
    const remaining = seg.end - t;
    if (remaining < 0.1) {
      if (currentSegIndex + 1 < detectedSegments.length) {
        previewPlayer.currentTime = detectedSegments[currentSegIndex + 1].start;
      } else {
        stopPreviewBtn.click();
        return;
      }
    }
  } else {
    const nextSeg = detectedSegments.find(s => s.start > t);
    if (nextSeg) {
      previewPlayer.currentTime = nextSeg.start;
    } else {
      stopPreviewBtn.click();
      return;
    }
  }
  previewTimeout = setTimeout(checkPlayHead, 50);
}

// --- 8. Export (FFmpeg) ---
exportBtn.addEventListener('click', async () => {
  if (!ffmpeg) await initFFmpeg();
  if (!ffmpeg.isLoaded()) {
    alert("FFmpegがロードされていません。");
    return;
  }
  
  exportBtn.disabled = true;
  exportStatus.innerText = "ファイルを読み込み中...";
  exportStatus.className = "status-msg";
  exportProgressBar.style.width = "0%";

  try {
    const { fetchFile } = FFmpeg;
    const inputName = 'input.mp4';
    const outputName = 'output.mp4';
    
    ffmpeg.FS('writeFile', inputName, await fetchFile(rawFile));
    
    let filterStr = "";
    let maps = "";
    
    detectedSegments.forEach((seg, i) => {
      const start = seg.start.toFixed(3);
      const end = seg.end.toFixed(3);
      filterStr += `[0:v]trim=start=${start}:end=${end},setpts=PTS-STARTPTS[v${i}];`;
      filterStr += `[0:a]atrim=start=${start}:end=${end},asetpts=PTS-STARTPTS[a${i}];`;
      maps += `[v${i}][a${i}]`;
    });
    
    filterStr += `${maps}concat=n=${detectedSegments.length}:v=1:a=1[outv][outa]`;
    
    log("Filter: " + filterStr);
    exportStatus.innerText = "エンコード中... (時間がかかります)";
    
    await ffmpeg.run(
      '-i', inputName,
      '-filter_complex', filterStr,
      '-map', '[outv]', '-map', '[outa]',
      '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
      '-c:a', 'aac',
      outputName
    );
    
    exportStatus.innerText = "書き出し完了！";
    
    const data = ffmpeg.FS('readFile', outputName);
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    
    downloadLink.href = url;
    downloadLink.download = `cut_${rawFile.name}`;
    downloadLink.style.display = 'inline-block';
    
    ffmpeg.FS('unlink', inputName);
    ffmpeg.FS('unlink', outputName);
    
  } catch (e) {
    console.error(e);
    log("Export Error: " + e.message);
    exportStatus.innerText = "エラーが発生しました";
    exportStatus.className = "status-msg err";
  } finally {
    exportBtn.disabled = false;
  }
});
</script>

</body>
</html>
